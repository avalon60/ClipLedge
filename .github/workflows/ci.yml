name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mint-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libsqlcipher-dev libssl-dev pkg-config xvfb xclip dbus-x11 gnome-keyring
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.75.0'
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --locked
      - run: cargo build --release --locked
      - name: X11 protocol tests
        run: xvfb-run -a cargo test --locked --test x11_backend -- --ignored --test-threads=1
      - name: Private Secret Service and GTK tests
        run: xvfb-run -a dbus-run-session --config-file=tests/session.conf -- sh tests/desktop-session.sh
      - name: Isolated GTK lifecycle smoke test
        run: xvfb-run -a dbus-run-session --config-file=tests/session.conf -- sh tests/smoke.sh
